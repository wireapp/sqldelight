name: Publish a release

on:
  push:
    tags:
      - '*'

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

env:
  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
  GRADLE_OPTS: -Dkotlin.incremental=false -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false -Dorg.gradle.logging.stacktrace=full

jobs:
  publish_archives:
    runs-on: macos-latest
    if: github.repository == 'wireapp/sqldelight'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.ci-java-version
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-cleanup: always

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::093205192929:role/gh-actions-maven-publish-sqldelight
          aws-region: us-east-1

      - name: Set version from tag
        run: echo "ORG_GRADLE_PROJECT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Seed publish dir from S3
        run: aws s3 cp s3://maven-wire-com/com/wire/sqldelight/ build/maven-publish/com/wire/sqldelight/ --recursive --no-overwrite --quiet

      - name: Publish to Wire Maven (local staging)
        run: ./gradlew publishAllPublicationsToWireStagingRepository --no-parallel
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}

      - name: Sync artifacts to S3
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if aws s3 ls "s3://maven-wire-com/com/wire/sqldelight/runtime/${VERSION}/" >/dev/null 2>&1; then
            echo "Version ${VERSION} already exists in Wire Maven repository, skipping publish"
            exit 1
          fi
          aws s3 cp build/maven-publish s3://maven-wire-com/ --recursive --include "maven-metadata.xml"
          aws s3 cp build/maven-publish s3://maven-wire-com/ --recursive --exclude "maven-metadata.xml*" --exclude "*.sha1" --exclude "*.md5" --exclude "*.sha256" --exclude "*.sha512" --no-overwrite
        env:
          AWS_REGION: us-east-1

  publish_npm_packages:
    runs-on: ubuntu-latest
    if: false
    permissions:
      contents: read
      id-token: write
    needs: publish_archives

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Gradle files
        run: |
          cd ~
          mkdir -p .gradle/ && touch .gradle/gradle.properties
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        id: setup-java
        with:
          distribution: 'zulu'
          java-version-file: .github/workflows/.ci-java-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Setup Gradle Java installations paths
        run: |
          cd ~/.gradle
          echo "org.gradle.java.installations.paths=${{ steps.setup-java.outputs.path }}" >> gradle.properties
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-cleanup: always

      - name: Get Version
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        id: version

      - name: Assemble NPM Packages
        run: ./gradlew :drivers:web-worker-driver:sqljs:assemblePackage

      - name: Publish SNAPSHOT Packages
        working-directory: drivers/web-worker-driver/sqljs/build/package
        if: ${{ success() && contains(steps.version.outputs.VERSION_NAME, 'SNAPSHOT') }}
        run: npm publish --tag snapshot

      - name: Publish Packages
        working-directory: drivers/web-worker-driver/sqljs/build/package
        if: ${{ success() && !contains(steps.version.outputs.VERSION_NAME, 'SNAPSHOT') }}
        run: npm publish

  publish_release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - publish_archives
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes
        id: release_notes
        uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.release_notes.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
